<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pointili - برج بوعريريج</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* شاشة الاختيار الأولية (فتح أو تحميل) */
    #choiceScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
      margin-top: 50px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    #choiceScreen h2 { color: #22c55e; margin-bottom: 10px; font-size: 22px; }
    #choiceScreen p { color: #a1a1aa; font-size: 13px; margin-bottom: 25px; line-height: 1.5; }

    .choice-btn {
      width: 100%;
      padding: 14px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border: none;
      margin-bottom: 12px;
      transition: background 0.2s, transform 0.1s;
    }
    .choice-btn:active { transform: scale(0.98); }
    .btn-open { background: #22c55e; color: #000; }
    .btn-open:hover { background: #16a34a; }
    .btn-install { background: #2563eb; color: #fff; display: block; }
    .btn-install:hover { background: #1d4ed8; }

    /* حاوية التطبيق الرئيسية (مخفية لحين الضغط على فتح) */
    #mainAppContainer {
      display: none;
      width: 100%;
      max-width: 420px;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    /* تنسيقات واجهة التطبيق الأصلية */
    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
    }

    .badge-btn {
      background: #18181b;
      border: 1px solid #27272a;
      color: #22c55e;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: border-color 0.2s;
    }
    .badge-btn:hover { border-color: #22c55e; }

    .main-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 24px;
      padding: 25px 20px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }

    .main-card h2 { color: #22c55e; font-size: 20px; margin-bottom: 8px; }
    .main-card p { color: #a1a1aa; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }

    /* صندوق تسجيل الدخول بجوجل */
    .google-auth-wrapper {
      display: flex;
      justify-content: center;
      margin: 15px 0;
      min-height: 44px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }

    .feature-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 15px 5px;
      text-align: center;
      font-size: 11px;
      color: #fff;
    }
    .feature-box span { display: block; color: #22c55e; font-weight: bold; font-size: 13px; margin-top: 5px; }

    .footer-text {
      color: #71717a;
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 1. شاشة الترحيب والاختيار (فتح أو تحميل) -->
  <div id="choiceScreen">
    <h2>Pointili</h2>
    <p>اختر طريقة تشغيل التطبيق للبدء فوراً في جمع الأختام:</p>
    <button class="choice-btn btn-open" onclick="startAppDirectly()">🌐 فتح التطبيق مباشرة</button>
    <button id="installAppBtn" class="choice-btn btn-install" onclick="installPWA()">📥 تحميل وتثبيت على الهاتف</button>
  </div>

  <!-- 2. واجهة التطبيق الرئيسية (تظهر بعد النقر على فتح) -->
  <div id="mainAppContainer">
    
    <!-- الشريط العلوي -->
    <div class="top-bar">
      <button class="badge-btn" onclick="window.location.href='/'">🛡️ بوابة الإدارة</button>
      <button class="badge-btn" onclick="backToChoices()">↩ العودة للخيار</button>
    </div>

    <!-- البطاقة الرئيسية لتسجيل الدخول -->
    <div class="main-card">
      <h2>تسجيل الدخول</h2>
      <p>سجل بحسابك الحقيقي لتبدأ في جمع الأختام بكل أمان وثقة.</p>

      <!-- زر تسجيل الدخول الحقيقي بـ Google -->
      <div class="google-auth-wrapper" id="googleLoginDiv">
        <div id="g_id_onload"
             data-client_id="1043668200753-n9veclikvkeelm5988ncj9c6jrc5ds5l.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="pill"
             data-theme="filled_black"
             data-text="signin_with"
             data-size="large"
             data-locale="ar">
        </div>
      </div>

      <div id="userWelcomeDisplay" style="display:none; color: #22c55e; font-weight: bold; font-size: 15px; margin-top: 15px; line-height: 1.6;"></div>

      <div style="margin-top: 15px; font-size: 11px; color: #71717a; border-top: 1px solid #27272a; padding-top: 12px;">
        🔒 خصوصية 100% • بريدك مخفي تماماً
      </div>
    </div>

    <!-- المزايا الثلاث السفلية -->
    <div class="features-grid">
      <div class="feature-box">مسح كود QR <span>في ثانية واحدة</span></div>
      <div class="feature-box">6 دوائر <span>هدية مجانية</span></div>
      <div class="feature-box">برج بوعريريج <span>مطاعم 34</span></div>
    </div>

    <div class="footer-text">Pointili • BBA © 2026</div>
  </div>

  <!-- مكتبة Google Sign-In الرسمية -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    let deferredPrompt;

    // التقاط إشارة التثبيت للمتصفحات الداعمة
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.style.display = 'block';
    });

    // دالة فتح التطبيق مباشرة
    function startAppDirectly() {
      document.getElementById('choiceScreen').style.display = 'none';
      document.getElementById('mainAppContainer').style.display = 'flex';
    }

    // العودة لواجهة الخيارات
    function backToChoices() {
      document.getElementById('mainAppContainer').style.display = 'none';
      document.getElementById('choiceScreen').style.display = 'flex';
    }

    // دالة التثبيت اليدوي
    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('تم التثبيت');
          }
          deferredPrompt = null;
        });
      } else {
        startAppDirectly();
      }
    }

    // استجابة تسجيل الدخول الحقيقي عبر Google
    function handleCredentialResponse(response) {
      const userInfo = parseJwt(response.credential);
      
      localStorage.setItem("user_email", userInfo.email);
      if (userInfo.name) {
        localStorage.setItem("user_name", userInfo.name);
      }
      
      // إخفاء زر جوجل وإظهار رسالة الترحيب الشخصية بالاسم
      const loginDiv = document.getElementById('googleLoginDiv');
      if (loginDiv) loginDiv.style.display = 'none';

      const welcomeDisplay = document.getElementById('userWelcomeDisplay');
      if (welcomeDisplay) {
        welcomeDisplay.style.display = 'block';
        welcomeDisplay.innerHTML = `أهلاً بك يا ${userInfo.name || 'مستخدم'} 👋<br><span style="font-size: 12px; color: #a1a1aa;">تم تسجيل الدخول بنجاح بحسابك الحقيقي! جاري نقلك للتطبيق...</span>`;
      }

      setTimeout(() => {
        window.location.href = '/';
      }, 1000);
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }
  </script>

</body>
</html>
