<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pointili - فتح أو تحميل</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 380px;
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      box-sizing: border-box;
    }

    h2 { color: #22c55e; font-size: 20px; margin-bottom: 10px; }
    p { color: #aaa; font-size: 13px; line-height: 1.5; margin-bottom: 25px; }

    /* أزرار الاختيار بين الفتح والتحميل */
    .choice-btn {
      width: 100%;
      padding: 14px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border: none;
      margin-bottom: 12px;
      transition: background 0.2s, transform 0.1s;
    }
    .choice-btn:active { transform: scale(0.98); }

    .btn-open {
      background: #22c55e;
      color: #000;
    }
    .btn-open:hover { background: #16a34a; }

    .btn-install {
      background: #2563eb;
      color: #fff;
      display: block; /* يظهر للمستخدم ويدعم التثبيت المباشر */
    }
    .btn-install:hover { background: #1d4ed8; }

    /* شاشة التطبيق الرئيسية (مخفية لحين اختيار الفتح أو تسجيل الدخول) */
    #appContent {
      display: none;
    }

    .google-auth-box {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    #userGreeting {
      color: #22c55e;
      font-weight: bold;
      font-size: 16px;
      margin-top: 15px;
      line-height: 1.6;
    }

    .back-btn {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 8px 16px;
      border-radius: 15px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 15px;
    }
    .back-btn:hover { color: #fff; border-color: #666; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- واجهة الاختيار (فتح أو تحميل) -->
    <div id="welcomeChoiceScreen">
      <h2>Pointili - برج بوعريريج</h2>
      <p>اختر كيف تريد استخدام تطبيق الولاء الخاص بك:</p>
      
      <!-- خيار الفتح المباشر -->
      <button class="choice-btn btn-open" onclick="openDirectly()">🌐 فتح التطبيق مباشرة</button>
      
      <!-- خيار التثبيت/التحميل (يظهر تلقائياً لو المتصفح يدعمه) -->
      <button id="installChoiceBtn" class="choice-btn btn-install" onclick="installApp()">📥 تحميل وتثبيت على الهاتف</button>
    </div>

    <!-- محتوى التطبيق الفعلي (يظهر بعد اختيار الفتح) -->
    <div id="appContent">
      <h2>تسجيل الدخول</h2>
      <p>سجل بحسابك لتبدأ في جمع الأختام بكل أمان.</p>

      <div class="google-auth-box" id="loginWrapper">
        <div id="g_id_onload"
             data-client_id="1043668200753-n9veclikvkeelm5988ncj9c6jrc5ds5l.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="pill"
             data-theme="filled_black"
             data-text="signin_with"
             data-size="large"
             data-locale="ar">
        </div>
      </div>

      <div id="userGreeting"></div>

      <button class="back-btn" onclick="backToChoice()">↩ العودة لخيارات الفتح والتحميل</button>
    </div>

  </div>

  <!-- مكتبة Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    let deferredPrompt;

    // التقاط إشارة إمكانية التثبيت من المتصفح
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installChoiceBtn');
      if (btn) btn.style.display = 'block';
    });

    // زر "فتح التطبيق مباشرة"
    function openDirectly() {
      document.getElementById('welcomeChoiceScreen').style.display = 'none';
      document.getElementById('appContent').style.display = 'block';
    }

    function backToChoice() {
      document.getElementById('appContent').style.display = 'none';
      document.getElementById('welcomeChoiceScreen').style.display = 'block';
    }

    // زر "تحميل وتثبيت"
    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('تم قبول التثبيت');
          }
          deferredPrompt = null;
        });
      } else {
        alert("التثبيت التلقائي غير مدعوم في هذا المتصفح، يمكنك فتحه مباشرة أو إضافته للشاشة الرئيسية يدويًا من إعدادات المتصفح.");
        openDirectly(); // الانتقال المباشر للتطبيق
      }
    }

    // معالجة تسجيل الدخول بـ Google
    function handleCredentialResponse(response) {
      const userInfo = parseJwt(response.credential);
      
      localStorage.setItem("user_email", userInfo.email);
      if (userInfo.name) {
        localStorage.setItem("user_name", userInfo.name);
      }
      
      const wrapper = document.getElementById("loginWrapper");
      if (wrapper) wrapper.style.display = "none";
      
      const greeting = document.getElementById("userGreeting");
      if (greeting) {
        greeting.innerHTML = `أهلاً بك، ${userInfo.name || 'مستخدم'} 👋<br><span style="font-size:11px; color:#aaa;">تم تسجيل الدخول بنجاح! جاري الانتقال للتطبيق...</span>`;
      }

      setTimeout(() => {
        window.location.href = '/';
      }, 1000);
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }
  </script>

</body>
</html>
